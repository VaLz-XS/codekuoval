<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>codekuoval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</head>
<body>

  <!-- --loading-screen-- -->

  <div id="loader" class="loader">
    <div class="stars" id="stars"></div>
    <i class="fa-solid fa-rocket rocket"></i>
    <p class="loader-text">Memuat <span id="loaderPage">Beranda</span></p>
  </div>

  <!-- --header-- -->

  <header class="top">
    <div class="brand"><i class="fa-solid fa-code"></i> codekuoval</div>
    <a class="adm" href="unknown" aria-label="Admin"><i class="fa-solid fa-shield-halved"></i></a>
  </header>

  <main>

    <!-- --hero-card-- -->

    <section id="home" class="hero">
      <p class="lbl">Paste tersimpan</p>
      <div class="big" id="bigCount">0</div>
      <div class="row small">
        <span id="slotLeft">20 slot tersisa</span>
        <span id="slotUsed">0/20</span>
      </div>
      <div class="wave g"><i id="quotaBar"></i></div>
      <div class="divider"></div>
      <div class="row">
        <span class="small">Ukuran total</span>
        <b id="sizeTotal">0 KB</b>
      </div>
    </section>

    <!-- --quick-actions-- -->

    <section class="actions">
      <button class="act" data-act="create"><span class="blob b-beige"><i class="fa-solid fa-plus"></i></span>Buat</button>
      <button class="act" data-act="copy"><span class="blob b-dark"><i class="fa-solid fa-copy"></i></span>Salin</button>
      <button class="act" data-act="search"><span class="blob b-blue"><i class="fa-solid fa-magnifying-glass"></i></span>Cari</button>
      <button class="act" data-act="recent"><span class="blob b-pink"><i class="fa-solid fa-clock-rotate-left"></i></span>Riwayat</button>
    </section>

    <!-- --languages-- -->

    <section id="langs" class="block">
      <div class="head"><h2>Bahasa</h2><span class="link">Semua</span></div>
      <div id="langList"></div>
    </section>

    <!-- --composer-- -->

    <section id="create" class="block">
      <div class="head"><h2>Buat paste</h2></div>
      <div class="card composer">
        <input id="title" class="field" type="text" placeholder="Judul paste" maxlength="60">
        <select id="lang" class="field">
          <option>HTML</option><option>CSS</option><option>JavaScript</option>
          <option>Python</option><option>Lainnya</option>
        </select>
        <textarea id="code" class="field code" placeholder="Tempel kode di sini..." spellcheck="false"></textarea>
        <button id="save" class="btn"><i class="fa-solid fa-paper-plane"></i> Simpan Paste</button>
      </div>
    </section>

    <!-- --recent-list-- -->

    <section id="recent" class="block">
      <div class="head"><h2>Terbaru</h2></div>
      <input id="search" class="field search" type="text" placeholder="Cari judul atau bahasa">
      <div id="list"></div>
    </section>

  </main>

  <!-- --floating-nav-- -->

  <nav class="fnav" id="fnav">
    <button class="nbtn active" data-target="home"><span class="ic"><i class="fa-solid fa-house"></i></span><small>Beranda</small></button>
    <button class="nbtn" data-target="langs"><span class="ic"><i class="fa-solid fa-layer-group"></i></span><small>Bahasa</small></button>
    <button class="nbtn main" data-target="create"><span class="ic"><i class="fa-solid fa-plus"></i></span><small>Buat</small></button>
    <button class="nbtn" data-target="recent"><span class="ic"><i class="fa-solid fa-clock-rotate-left"></i></span><small>Terbaru</small></button>
    <button class="nbtn" data-target="search"><span class="ic"><i class="fa-solid fa-magnifying-glass"></i></span><small>Cari</small></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
